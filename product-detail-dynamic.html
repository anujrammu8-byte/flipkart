  <script src="./Apple 2025 MacBook Pro Laptop with M5 chip, 10-core CPU and 10-core GPU_ Built for Apple Intelligence, 35.97 cm (14.2) Liquid Retina XDR Display, 16GB Unified Memory, 1TB SSD Storage; Space Black -  productdetail_files/bootstrap.bundle.min.js"></script>
  <script>
    let PRODUCT = null;

    async function loadProduct() {
      const id = new URLSearchParams(window.location.search).get('id');
      if (!id) return;
      const res = await fetch('http://localhost:3000/products');
      const data = await res.json();
      PRODUCT = data.products.find(p => p.id == id);
      if (!PRODUCT) return;

      // Parse slider images
      let slides = [];
      try { slides = JSON.parse(PRODUCT.slider_images); } catch(e) {}
      if (!slides.length) slides = [PRODUCT.image_url];

      // Build carousel slides
      const inner = document.getElementById('carouselInner');
      const indicators = document.getElementById('carouselIndicators');

      inner.innerHTML = slides.map((img, i) =>
        `<div class="carousel-item ${i===0?'active':''}"><img src="${img}" class="d-block w-100" alt="Product Image"></div>`
      ).join('');

      indicators.innerHTML = slides.map((_, i) =>
        `<button type="button" data-bs-target="#sliderX" data-bs-slide-to="${i}" ${i===0?'class="active" aria-current="true"':'class=""'}></button>`
      ).join('');

      // Reinitialize Bootstrap carousel for touch/swipe
      const carouselEl = document.getElementById('sliderX');
      if (window.bootstrap) new bootstrap.Carousel(carouselEl, { touch: true, interval: false });

      document.title = PRODUCT.name;
      document.getElementById('descImg').src = slides[0];
      document.getElementById('productName').textContent = PRODUCT.name;
      document.getElementById('productDiscount').textContent = PRODUCT.discount + '%';
      document.getElementById('productMrp').textContent = '₹' + Number(PRODUCT.mrp).toLocaleString('en-IN');
      document.getElementById('productPrice').textContent = '₹' + Number(PRODUCT.selling_price).toLocaleString('en-IN');
      document.getElementById('productWow').textContent = '₹' + Number(PRODUCT.wow_price).toLocaleString('en-IN');
      document.getElementById('ratingVal').textContent = (Math.random() * (5 - 4.5) + 4.5).toFixed(1);
      document.getElementById('ratingCount').textContent = '• ' + (Math.floor(Math.random() * 7000) + 3000) + ' ratings';

      const d = new Date(); d.setDate(d.getDate() + 2);
      document.getElementById('deliveryDate').textContent = d.toLocaleString('en-US', {day:'numeric',month:'short',weekday:'short'});

      document.getElementById('productContainer').style.display = 'block';

      let t = 15 * 60 + 10;
      setInterval(() => {
        document.getElementById('timer').textContent = Math.floor(t/60) + 'm ' + (t%60) + 's';
        if (--t < 0) t = 15 * 60 + 10;
      }, 1000);
    }

    function buyNow() {
      if (!PRODUCT) return;
      localStorage.setItem('selected_verient', JSON.stringify({
        name: PRODUCT.name,
        mrp: PRODUCT.mrp,
        selling_price: PRODUCT.selling_price,
        img1: PRODUCT.image_url
      }));
      window.location.href = './address.html';
    }

    loadProduct();
    document.addEventListener('contextmenu', e => e.preventDefault());
  </script>
